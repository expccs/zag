name: deploy

# Runs on a self-hosted runner installed on the ZAG host (deploy/README.md):
# the code is checked out on the machine itself, the UI is built and
# switched into /srv/zag/ui (nginx root), the server image is built
# locally and started with docker compose. No SSH, no registry.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        required: true
        default: all
        options: [all, web, server]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      web: ${{ steps.affected.outputs.web }}
      server: ${{ steps.affected.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: affected
        env:
          TARGET: ${{ inputs.target }}
          TURBO_SCM_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          emit() { echo "web=$1" >> "$GITHUB_OUTPUT"; echo "server=$2" >> "$GITHUB_OUTPUT"; echo "web=$1 server=$2"; }
          case "${TARGET:-}" in
            all)    emit true true;  exit 0 ;;
            web)    emit true false; exit 0 ;;
            server) emit false true; exit 0 ;;
          esac
          # force-push or first commit: before = 000…0 → deploy everything
          if [[ -z "$TURBO_SCM_BASE" || "$TURBO_SCM_BASE" =~ ^0+$ ]] \
             || ! git cat-file -e "$TURBO_SCM_BASE^{commit}" 2>/dev/null; then
            emit true true; exit 0
          fi
          PKGS=$(npx turbo ls --affected --output=json | jq -r '.packages.items[].name')
          echo "affected: $PKGS"
          WEB=false; SERVER=false
          grep -qx '@zag/web' <<<"$PKGS" && WEB=true
          grep -qx '@zag/server' <<<"$PKGS" && SERVER=true
          emit "$WEB" "$SERVER"

  deploy-web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: self-hosted
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx turbo run build --filter=@zag/web
        env:
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL }}
          VITE_APP_VERSION: ${{ github.sha }}
      - name: Install release and switch /srv/zag/ui
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f apps/web/dist/index.html || { echo '::error::apps/web/dist is empty'; exit 1; }
          RELEASE="/srv/zag/releases/$SHA"; UI=/srv/zag/ui
          mkdir -p "$RELEASE"
          rsync -a --delete apps/web/dist/ "$RELEASE/"
          chmod -R u=rwX,go=rX "$RELEASE" # readable by nginx (www-data)
          # nginx: root /srv/zag/ui — must be a symlink to the current release.
          # A real directory (e.g. created by hand on host setup) would make
          # `mv -T` fail, so move it aside once; it is pruned with old releases.
          if [ -d "$UI" ] && [ ! -L "$UI" ]; then
            mv "$UI" "/srv/zag/releases/manual-$(date +%s)"
          fi
          ln -sfn "$RELEASE" "$UI.tmp" && mv -Tf "$UI.tmp" "$UI"
          # keep the current + 4 previous releases
          ls -dt /srv/zag/releases/* | grep -vx "$RELEASE" | tail -n +5 | xargs -r rm -rf
          echo "$UI -> $(readlink -f "$UI")"
          ls "$UI"

  deploy-server:
    needs: detect
    if: needs.detect.outputs.server == 'true'
    runs-on: self-hosted
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -f apps/server/Dockerfile \
            --build-arg "APP_VERSION=$SHA" \
            -t "zag-server:$SHA" -t zag-server:latest .
      - name: Restart the server
        env:
          SERVER_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -f /srv/zag/.env || { echo '::error::/srv/zag/.env is missing (deploy/README.md)'; exit 1; }
          docker compose -f deploy/docker-compose.yml up -d --remove-orphans server
          for i in $(seq 1 15); do
            curl -fsS localhost:8080/health && exit 0
            sleep 2
          done
          echo '::error::server did not become healthy'
          docker compose -f deploy/docker-compose.yml logs --tail=50 server
          exit 1
      - name: Remove old images
        if: success()
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # old zag-server tags (everything but the running one and :latest)
          docker images zag-server --format '{{.Tag}}' \
            | grep -vx -e "$SHA" -e latest -e '<none>' \
            | xargs -r -I{} docker rmi "zag-server:{}"
          # dangling layers from previous builds
          docker image prune -f
          docker images zag-server
