# Used from the repo checkout by deploy.yml on the self-hosted runner:
#   docker compose -f deploy/docker-compose.yml up -d server
# The only runtime process: Socket.IO + /health. nginx runs on the host.
name: zag
services:
  server:
    image: zag-server:${SERVER_TAG:-latest} # built locally by deploy.yml
    env_file: /srv/zag/.env
    ports:
      - '127.0.0.1:8080:8080' # reachable only by host nginx
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
