# Lives on the host at /srv/zag/docker-compose.yml (docs/monorepo.md § 6).
# The only runtime process: Socket.IO + /health. nginx runs on the host.
services:
  server:
    image: ghcr.io/expccs/zag-server:${SERVER_TAG:-latest}
    env_file: /srv/zag/.env
    ports:
      - '127.0.0.1:8080:8080' # reachable only by host nginx
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
