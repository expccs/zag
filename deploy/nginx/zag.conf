# /etc/nginx/sites-available/zag  (docs/monorepo.md § 6)
# TLS / server_name are left to the host (certbot); this is the site body.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;  # [set] the ZAG domain

  root /srv/zag/ui;               # symlink -> /srv/zag/releases/<sha>
  index index.html;

  open_file_cache max=1000 inactive=60s;
  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml
             application/json application/manifest+json;

  # hashed Vite assets: cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # files through which a PWA update arrives: always revalidate
  location = /index.html         { add_header Cache-Control "no-cache"; }
  location = /sw.js              { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }

  location /socket.io/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location = /health {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
