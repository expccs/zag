# /etc/nginx/sites-available/zag  (docs/monorepo.md § 6)
# TLS blocks are managed by certbot on the host; keep them when syncing.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  server_name my.zag.com.ua;  # [set] the ZAG domain

  root /srv/zag/ui;               # symlink -> /srv/zag/releases/<sha>, set by CI
  index index.html;

  # no open_file_cache: it pins fds to the old release for up to 60s after
  # the symlink switch, so a fresh index.html would reference 404ing assets
  gzip on;
  gzip_types text/html text/css application/javascript image/svg+xml
             application/json application/manifest+json;

  # hashed Vite assets: cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # files through which a PWA update arrives: always revalidate
  location = /index.html         { add_header Cache-Control "no-cache"; }
  location = /sw.js              { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }

  location /socket.io/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location = /health {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # GET /session/<userId>: a reloaded phone restores its place in the queue
  location /session/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
  # HTTP/2: one connection for index.html, the chunks and the fonts.
  # nginx < 1.25.1 has no `http2` directive: use `listen 443 ssl http2;`
  # on both listen lines above instead. Server push is not used: nginx
  # 1.25.1 removed `http2_push`, and Chrome 106+ / Firefox 132+ ignore
  # pushed streams; the preloads live in index.html (vite.config.ts).
  http2 on;
    ssl_certificate /etc/letsencrypt/live/my.zag.com.ua/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/my.zag.com.ua/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = my.zag.com.ua) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  listen [::]:80;
  server_name my.zag.com.ua;
    return 404; # managed by Certbot


}
